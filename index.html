<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#167a4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Escala Veterinária</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="heading">
        <h1>Escala veterinária</h1>
        <p>Personalize os nomes e arraste os cartões para trocar os plantões.</p>
      </div>

      <div class="controls">
        <label>Mês<select id="month"></select></label>
        <label>Ano<select id="year"></select></label>
      </div>

      <div class="names">
        <label>Veterinária 1<input id="name1" maxlength="30" autocomplete="off"></label>
        <label>Veterinária 2<input id="name2" maxlength="30" autocomplete="off"></label>
        <button id="saveNames" class="primary">Salvar nomes</button>
      </div>
    </header>

    <main class="panel">
      <div class="bar">
        <h2 id="title"></h2>
        <div class="legend">
          <span><i class="dot green"></i><b id="legend1"></b></span>
          <span><i class="dot red"></i><b id="legend2"></b></span>
          <span><i class="dot orange"></i>Alterado</span>
        </div>
      </div>

      <div class="help">
        <b>No iPhone:</b> pressione um cartão por um instante, arraste até outra data e solte.
        As datas permanecem fixas. Somente as veterinárias são trocadas.
      </div>

      <div id="syncStatus" class="sync-status"></div>
      <div id="calendar" class="calendar"></div>

      <div class="lower">
        <section class="box">
          <h3>Resumo do mês</h3>
          <div id="counts" class="counts"></div>
        </section>

        <section class="box">
          <h3 id="nextTitle"></h3>
          <div id="next" class="next"></div>
        </section>
      </div>

      <div class="actions">
        <button id="undo">Desfazer última troca</button>
        <button id="reset">Restaurar escala original</button>
      </div>
      <div id="status" class="status"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
