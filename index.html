<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#167a4a"><title>Escala Veterinaria</title><style>
:root{--bg:#f3f7f5;--surface:#fff;--text:#17362a;--muted:#6b7f76;--line:#e1ebe6;--green:#167a4a;--green-soft:#e7f7ee;--red:#bf3636;--red-soft:#fff0f0;--orange:#f59e0b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#f8fbf9,#edf4f0);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:24px;padding-bottom:max(24px,env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}.app{max-width:1220px;margin:auto}.header{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:18px}.header h1{margin:0 0 5px;font-size:36px;letter-spacing:-1.2px}.header p{margin:0;color:var(--muted)}.controls,.names{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.names{grid-column:1/-1;padding-top:14px;border-top:1px solid var(--line)}label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}select,input,button{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 13px;font:inherit;color:var(--text)}input{min-width:170px}button{cursor:pointer;font-weight:750}.primary{background:var(--green);border-color:var(--green);color:#fff}.panel{background:rgba(255,255,255,.94);border:1px solid #fff;border-radius:24px;padding:21px;box-shadow:0 18px 55px rgba(27,60,45,.09)}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.bar h2{margin:0;font-size:23px}.legend{display:flex;gap:7px;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:6px;background:#f7faf8;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:700;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%}.help{margin:15px 0;padding:11px 14px;border:1px solid #dcece4;background:#f4fbf7;border-radius:13px;color:#456458;font-size:13px;line-height:1.45}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}.weekday{text-align:center;padding:6px 0;color:#8a9a92;text-transform:uppercase;font-size:11px;font-weight:850}.blank{min-height:108px}.day{position:relative;min-height:108px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:16px;cursor:grab;user-select:none;touch-action:none;transition:.15s}.day:active{cursor:grabbing}.day:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(27,60,45,.08)}.date{display:block;font-size:18px;font-weight:900}.date small{display:block;margin-top:3px;color:#a0ada7;font-size:9px;text-transform:uppercase}.person{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:16px;min-height:38px;padding:10px 5px;border-radius:11px;font-size:12px;font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.person:before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:currentColor}.role1{background:var(--green-soft);color:var(--green)}.role2{background:var(--red-soft);color:var(--red)}.changed{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--orange)}.dragging{opacity:.3;transform:scale(.96)}.target{border-color:#19a66e;box-shadow:0 0 0 4px rgba(25,166,110,.16);transform:scale(1.025)}.lower{display:grid;grid-template-columns:220px 1fr;gap:17px;margin-top:18px}.box{background:#f8fbf9;border:1px solid var(--line);border-radius:16px;padding:14px}.box h3{margin:0 0 11px;font-size:14px}.counts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.count{text-align:center;border-radius:11px;padding:10px 5px;font-size:10px;font-weight:800}.count strong{display:block;font-size:22px}.next{display:grid;grid-template-columns:repeat(7,minmax(80px,1fr));gap:7px;overflow-x:auto;padding-bottom:4px}.mini{min-height:87px;padding:8px}.mini .date{font-size:14px}.mini .person{margin-top:9px;min-height:31px;padding:7px 3px;font-size:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{min-height:20px;margin-top:9px;color:var(--green);font-size:13px;font-weight:750}.ghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) rotate(3deg);padding:12px 17px;border-radius:13px;box-shadow:0 18px 40px rgba(0,0,0,.22);font-weight:850;text-align:center}
@media(max-width:760px){body{padding:max(12px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#f3f7f5}.header{grid-template-columns:1fr;gap:12px;margin-bottom:11px}.header h1{font-size:27px;line-height:1.05}.header p{font-size:13px;line-height:1.35}.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}.controls select{width:100%;height:42px}.names{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:11px}.names input{width:100%;min-width:0;height:42px;font-size:14px}.names button{grid-column:1/-1}.panel{padding:12px;border-radius:19px;box-shadow:0 10px 30px rgba(27,60,45,.07)}.bar{display:grid;gap:9px}.bar h2{font-size:20px}.legend{gap:5px}.legend span{padding:5px 8px;font-size:10px}.help{font-size:11px;padding:9px 10px;margin:11px 0}.calendar{gap:3px}.weekday{font-size:8px;padding:3px 0;letter-spacing:0}.blank,.day{min-height:69px}.day{padding:5px 3px;border-radius:10px}.day:hover{transform:none;box-shadow:none}.date{font-size:13px}.date small{display:none}.person{margin-top:9px;min-height:29px;padding:7px 1px;border-radius:8px;font-size:8px;gap:3px}.person:before{width:5px;height:5px;flex-basis:5px}.changed{right:4px;top:4px;width:5px;height:5px}.lower{display:flex;flex-direction:column;gap:12px;margin-top:13px}.box{padding:10px;border-radius:13px}.box h3{font-size:12px;margin-bottom:8px}.count{padding:8px 4px;font-size:9px}.count strong{font-size:18px}.next{grid-template-columns:repeat(7,minmax(72px,1fr));gap:5px;scroll-snap-type:x proximity}.mini{min-height:73px;scroll-snap-align:start}.mini .person{font-size:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions button{height:41px;padding:0 7px;font-size:11px}.status{font-size:11px}.ghost{max-width:150px;padding:10px 13px;font-size:11px}}
@media(max-width:380px){body{padding-left:6px;padding-right:6px}.panel{padding:8px}.calendar{gap:2px}.blank,.day{min-height:65px}.day{padding:4px 2px}.person{font-size:7.5px}.actions{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="header"><div><h1>Escala veterinaria</h1><p>Personalize os nomes e arraste os cartoes para trocar os plantoes.</p></div><div class="controls"><label>Mes<select id="month"></select></label><label>Ano<select id="year"></select></label></div><div class="names"><label>Veterinaria 1<input id="name1" maxlength="30"></label><label>Veterinaria 2<input id="name2" maxlength="30"></label><button id="saveNames" class="primary">Salvar nomes</button></div></header><main class="panel"><div class="bar"><h2 id="title"></h2><div class="legend"><span><i class="dot" style="background:#25a269"></i><b id="legend1"></b></span><span><i class="dot" style="background:#df4a4a"></i><b id="legend2"></b></span><span><i class="dot" style="background:#f59e0b"></i>Alterado</span></div></div><div class="help"><b>No iPhone:</b> pressione um cartao por um instante, arraste ate outra data e solte. As datas ficam fixas; somente as veterinarias sao trocadas.</div><div id="calendar" class="calendar"></div><div class="lower"><section class="box"><h3>Resumo do mes</h3><div id="counts" class="counts"></div></section><section class="box"><h3 id="nextTitle"></h3><div id="next" class="next"></div></section></div><div class="actions"><button id="undo">Desfazer ultima troca</button><button id="reset">Restaurar escala original</button></div><div id="status" class="status"></div></main></div><script>
(()=>{'use strict';const months=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],week=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'],$=id=>document.getElementById(id),month=$('month'),year=$('year');months.forEach((n,i)=>month.add(new Option(n,i+1)));for(let y=2026;y<=2030;y++)year.add(new Option(y,y));month.value=8;year.value=2026;let slots={};try{slots=JSON.parse(localStorage.getItem('vetMobileSlotsV4')||'{}')}catch(e){}let names={r1:'Rebeca',r2:'Samantha'};try{names={...names,...JSON.parse(localStorage.getItem('vetMobileNamesV4')||'{}')}}catch(e){}let history=[],drag=null,ghost=null;const key=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,utc=(y,m,d)=>Date.UTC(y,m-1,d);function base(y,m,d){return Math.abs(Math.round((utc(y,m,d)-utc(2026,8,1))/86400000)%2)===0?'r1':'r2'}function role(y,m,d){return slots[key(y,m,d)]||base(y,m,d)}function changed(y,m,d){return role(y,m,d)!==base(y,m,d)}function save(){localStorage.setItem('vetMobileSlotsV4',JSON.stringify(slots));localStorage.setItem('vetMobileNamesV4',JSON.stringify(names))}function card(y,m,d,mini=false){const r=role(y,m,d),k=key(y,m,d),wd=week[new Date(y,m-1,d).getDay()];return `<div class="day ${mini?'mini':''}" data-key="${k}">${changed(y,m,d)?'<i class="changed"></i>':''}<span class="date">${d}<small>${wd}</small></span><div class="person ${r==='r1'?'role1':'role2'}">${names[r]}</div></div>`}function render(){const y=+year.value,m=+month.value,days=new Date(y,m,0).getDate(),start=new Date(y,m-1,1).getDay(),cal=$('calendar');$('title').textContent=`${months[m-1]} de ${y}`;$('legend1').textContent=names.r1;$('legend2').textContent=names.r2;$('name1').value=names.r1;$('name2').value=names.r2;cal.innerHTML=week.map(w=>`<div class="weekday">${w}</div>`).join('')+'<div class="blank"></div>'.repeat(start);let a=0,b=0;for(let d=1;d<=days;d++){role(y,m,d)==='r1'?a++:b++;cal.insertAdjacentHTML('beforeend',card(y,m,d))}$('counts').innerHTML=`<div class="count role1"><strong>${a}</strong>${names.r1}</div><div class="count role2"><strong>${b}</strong>${names.r2}</div>`;const nm=m===12?1:m+1,ny=m===12?y+1:y;$('nextTitle').textContent=`Primeiros 7 dias de ${months[nm-1]}/${ny}`;$('next').innerHTML=Array.from({length:7},(_,i)=>card(ny,nm,i+1,true)).join('')}function target(x,y){const e=document.elementFromPoint(x,y),c=e&&e.closest('.day');return c&&c.dataset.key!==drag?.key?c:null}function clear(){document.querySelectorAll('.target').forEach(e=>e.classList.remove('target'))}function start(c,e){const p=c.querySelector('.person');drag={el:c,key:c.dataset.key};c.classList.add('dragging');ghost=document.createElement('div');ghost.className=`ghost ${p.classList.contains('role1')?'role1':'role2'}`;ghost.innerHTML=`<b>${c.querySelector('.date').childNodes[0].textContent.trim()}</b><br>${p.textContent}`;document.body.appendChild(ghost);move(e.clientX,e.clientY);c.setPointerCapture?.(e.pointerId)}function move(x,y){if(!drag)return;ghost.style.left=x+'px';ghost.style.top=y+'px';clear();target(x,y)?.classList.add('target')}function finish(x,y){if(!drag)return;const t=target(x,y);drag.el.classList.remove('dragging');clear();ghost?.remove();ghost=null;if(t){history.push({...slots});const a=drag.key,b=t.dataset.key,[ay,am,ad]=a.split('-').map(Number),[by,bm,bd]=b.split('-').map(Number),ra=role(ay,am,ad),rb=role(by,bm,bd);slots[a]=rb;slots[b]=ra;if(slots[a]===base(ay,am,ad))delete slots[a];if(slots[b]===base(by,bm,bd))delete slots[b];save();$('status').textContent=`Plantoes de ${ad}/${am} e ${bd}/${bm} trocados.`}drag=null;render()}document.addEventListener('pointerdown',e=>{const c=e.target.closest('.day');if(!c?.dataset.key)return;e.preventDefault();start(c,e)});document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();move(e.clientX,e.clientY)},{passive:false});document.addEventListener('pointerup',e=>{if(drag){e.preventDefault();finish(e.clientX,e.clientY)}});document.addEventListener('pointercancel',()=>{if(drag){drag.el.classList.remove('dragging');drag=null;ghost?.remove();ghost=null;clear()}});$('saveNames').onclick=()=>{const a=$('name1').value.trim(),b=$('name2').value.trim();if(!a||!b||a.toLowerCase()===b.toLowerCase()){$('status').textContent='Informe dois nomes diferentes.';return}names={r1:a,r2:b};save();render();$('status').textContent='Nomes atualizados.'};$('undo').onclick=()=>{if(!history.length){$('status').textContent='Nao ha troca para desfazer.';return}slots=history.pop();save();render();$('status').textContent='Ultima troca desfeita.'};$('reset').onclick=()=>{if(Object.keys(slots).length)history.push({...slots});slots={};save();render();$('status').textContent='Escala original restaurada.'};month.onchange=render;year.onchange=render;render()})();
</script></body></html>
